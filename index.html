<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kz's special machine</title>
<style>
body{background:#030712;color:#e2e8f0;font-family:Segoe UI,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.card{background:#0b1120;border:1px solid #1e293b;border-radius:12px;padding:28px;width:min(460px,92vw)}
input{width:100%;box-sizing:border-box;padding:10px;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:8px;margin:10px 0}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
p{color:#94a3b8;font-size:14px}
.err{color:#fca5a5;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="card">
<h2>kz's special machine</h2>
<p>Paste the link shown in your PC's tunnel window, then sign in with your password.</p>
<input id="u" placeholder="https://xxxx.trycloudflare.com">
<button onclick="go()">Open</button>
<div class="err" id="m"></div>
</div>
<script>
var box = document.getElementById("u");
box.value = localStorage.getItem("kz_tunnel") || "";
function go() {
  var v = box.value.trim();
  if (!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(v)) {
    document.getElementById("m").textContent = "Paste the https:// link from the tunnel window.";
    return;
  }
  localStorage.setItem("kz_tunnel", v);
  window.location.href = v.replace(/\/+$/, "") + "/";
}
</script>
</body>
</html>
